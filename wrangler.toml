name = "siahe"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
PUBLIC_URL = "https://REPLACE-WITH-YOUR-WORKER.workers.dev"
OWNER_IDS = "REPLACE-WITH-YOUR-NUMERIC-TELEGRAM-ID"
VERIFICATION_CHAT = ""
BACKUP_CHAT = ""

[[d1_databases]]
binding = "DB"
database_name = "siahe"
database_id = "REPLACE-WITH-D1-DATABASE-ID"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]
