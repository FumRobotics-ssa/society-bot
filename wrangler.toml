name = "robotics-society"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[vars]
PUBLIC_URL = "https://robotics-society.fum-robotics-ssa.workers.dev"
OWNER_IDS = "1229020784"
VERIFICATION_CHAT = "-1004405041822"
BACKUP_CHAT = "-1003932010959"

[[d1_databases]]
binding = "DB"
database_id = "0dfba6f2-cf7d-44a3-9e99-712531b7c261"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[[ratelimits]]
name = "CHECKIN_RATE_LIMITER"
namespace_id = "9472061843"

[ratelimits.simple]
limit = 120
period = 60
