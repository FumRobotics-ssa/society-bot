limit_req_zone $binary_remote_addr zone=robotics_web_ip:10m rate=15r/s;
limit_req_zone $server_name zone=robotics_web_total:1m rate=80r/s;
limit_req_zone $binary_remote_addr zone=robotics_login_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=robotics_connections_ip:10m;
limit_conn_zone $server_name zone=robotics_connections_total:1m;
proxy_cache_path /var/cache/robotics-posters levels=1:2 keys_zone=robotics_posters:4m max_size=128m inactive=30m use_temp_path=off;
