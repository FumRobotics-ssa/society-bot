limit_req_status 429;
limit_conn_status 429;
limit_req zone=robotics_web_ip burst=60 nodelay;
limit_req zone=robotics_web_total burst=120 nodelay;
limit_conn robotics_connections_ip 25;
limit_conn robotics_connections_total 120;
client_header_timeout 10s;
client_body_timeout 15s;

location = /api/session {
    limit_req zone=robotics_web_ip burst=60 nodelay;
    limit_req zone=robotics_web_total burst=120 nodelay;
    limit_req zone=robotics_login_ip burst=8 nodelay;
    client_max_body_size 4k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:8787;
}

location ~ ^/api/events/[0-9]+/poster$ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache robotics_posters;
    proxy_cache_key "$scheme$host$uri";
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://127.0.0.1:8787;
}
