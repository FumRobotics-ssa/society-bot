name: robotics-society
services:
  robotics-society:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DB_PATH: ${ROBOTICS_DB_PATH:-/app/data/robotics-society.sqlite}
    volumes:
      - robotics_data:/app/data
    ports:
      - 127.0.0.1:8787:8787
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  robotics_data:
    name: ${ROBOTICS_DATA_VOLUME:-robotics-society-data}
