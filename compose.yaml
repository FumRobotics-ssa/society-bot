name: robotics-society
x-runtime: &runtime
  image: ${ROBOTICS_IMAGE:-robotics-society:local}
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
services:
  robotics-society:
    <<: *runtime
    build: .
    stop_grace_period: 35s
    env_file: ${ROBOTICS_APP_ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: ${ROBOTICS_DB_PATH:-/app/data/robotics-society.sqlite}
    volumes:
      - robotics_data:/app/data
    ports:
      - "127.0.0.1:${ROBOTICS_BIND_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s
  telegram-receiver:
    <<: *runtime
    pull_policy: never
    stop_grace_period: 15s
    env_file: ${ROBOTICS_RECEIVER_ENV_FILE:-.env.receiver}
    environment:
      TELEGRAM_INGRESS_URL: http://robotics-society:8787/telegram
    command: ["node", "scripts/receive-telegram.js"]
    depends_on:
      robotics-society:
        condition: service_healthy
volumes:
  robotics_data:
    name: ${ROBOTICS_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_robotics_data}
